<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Banking Q</title>
    <link rel="stylesheet" href="banking.css">
    </head>
    <body>
        
        <header class="login-header">
            <img src="bankinglogo2.jpeg" alt="bank logo">
            <a href="banking.html" class="login-brand">
    </a>

    <a href="banking.html" class="back-home">Back to Home</a>

       </header>
        
        <main>
            <section class="login-section">

    <div class="login-container">

        <h1>Welcome Back</h1>
        <p>Log in to your Banking Q account.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">
                Log In
            </button>

            <p id="loginMessage" aria-live="polite"></p>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="reg.html">Open Account</a>
        </p>

    </div>

</section>
        </main>
        <script src="login.js"></script>
    </body>
</html>
